# Where a packaged cambrian-perception may write: its state (checkpoints,
# logs), its detector model and its Python venv. The code itself is the
# package's, owned by root: the organism can't change its own program.
d /srv/cambrian 0711 root root -
d /srv/cambrian/cambrian-perception/state 0755 cambrian cambrian -
d /srv/cambrian/cambrian-perception/models 0755 cambrian cambrian -
d /srv/cambrian/cambrian-perception/.venv 0755 cambrian cambrian -
